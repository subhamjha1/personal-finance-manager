spring.application.name=personal-finance-manager
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

# Session cookie (server-side session). Secure flag is enabled in the "prod" profile / via env var.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Database: in-memory H2 by default; override with DB_URL/DB_USERNAME/DB_PASSWORD or use the "prod" profile (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:pfm;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Only the health endpoint is exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Time zone used for "today" (future-date validation, default goal start date)
app.timezone=${APP_TIMEZONE:UTC}
